[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "blockconditioning"
version = "0.1.0"
description = "Video object segmentation, 3D boxes, and FLUX isolation preprocessing."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "av>=14.0",
  "diffusers>=0.36.0",
  "ipython>=8.0",
  "matplotlib>=3.9",
  "numpy>=2.0",
  "openai>=2.0",
  "opencv-python-headless>=4.10",
  "pillow>=11.0",
  "pydantic>=2.10",
  "torch>=2.6",
  "torchvision>=0.21",
  "tqdm>=4.67",
  "transformers>=5.0",
]

[project.optional-dependencies]
dev = [
  "jupyterlab>=4.3",
]

[project.scripts]
blockconditioning = "blockconditioning.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/blockconditioning"]

